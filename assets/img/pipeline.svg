<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box{fill:#121826;stroke:#2a3547;rx:14;}
    .t{fill:#e6eaf2;font-size:15px;font-weight:600;}
    .s{fill:#8b95a7;font-size:11.5px;}
    .flow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr);}
  </style>

  <rect class="box" x="14"  y="40" width="150" height="90" rx="14"/>
  <text class="t" x="89" y="78" text-anchor="middle">Folder scan</text>
  <text class="s" x="89" y="97" text-anchor="middle">jpg/png/webp/tif</text>
  <text class="s" x="89" y="112" text-anchor="middle">recursive · EXIF-aware</text>

  <rect class="box" x="204" y="40" width="150" height="90" rx="14"/>
  <text class="t" x="279" y="70" text-anchor="middle">Decode</text>
  <text class="s" x="279" y="89" text-anchor="middle">EXIF orientation fix</text>
  <text class="s" x="279" y="104" text-anchor="middle">downscale to ≤640 px</text>

  <rect class="box" x="394" y="40" width="170" height="90" rx="14"/>
  <text class="t" x="479" y="70" text-anchor="middle">YuNet detector</text>
  <text class="s" x="479" y="89" text-anchor="middle">CUDA or CPU backend</text>
  <text class="s" x="479" y="104" text-anchor="middle">boxes mapped to full-res</text>

  <rect class="box" x="604" y="40" width="190" height="90" rx="14"/>
  <text class="t" x="699" y="62" text-anchor="middle">Sharpness scoring</text>
  <text class="s" x="699" y="81" text-anchor="middle">Laplacian variance · Tenengrad</text>
  <text class="s" x="699" y="96" text-anchor="middle">FFT high-freq ratio · contrast</text>
  <text class="s" x="699" y="111" text-anchor="middle">→ 0–100 score per face</text>

  <rect class="box" x="834" y="40" width="212" height="90" rx="14"/>
  <text class="t" x="940" y="70" text-anchor="middle">Best face + report</text>
  <text class="s" x="940" y="89" text-anchor="middle">annotated images · HTML</text>
  <text class="s" x="940" y="104" text-anchor="middle">CSV · JSON · logs</text>

  <path class="flow" d="M164,85 L198,85"/>
  <path class="flow" d="M354,85 L388,85"/>
  <path class="flow" d="M564,85 L598,85"/>
  <path class="flow" d="M794,85 L828,85"/>

  <rect class="box" x="204" y="190" width="380" height="72" rx="14"/>
  <text class="t" x="394" y="220" text-anchor="middle">Thread pool (per-worker detectors)</text>
  <text class="s" x="394" y="239" text-anchor="middle">imread / imdecode in parallel · progress + cancel · mutex-shared results</text>

  <path class="flow" d="M279,136 L279,185" stroke-dasharray="5,4"/>
  <path class="flow" d="M479,136 L479,185" stroke-dasharray="5,4"/>

  <rect x="14" y="190" width="150" height="72" rx="14" fill="#101a2e" stroke="#2a3547"/>
  <text class="t" x="89" y="220" text-anchor="middle">Logger</text>
  <text class="s" x="89" y="239" text-anchor="middle">.log + events.jsonl</text>

  <path class="flow" d="M164,226 L198,226" stroke-dasharray="5,4"/>
</svg>
